[project]
name = "poirot"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.3",
    "langchain-openai>=1.1.7",
    "langchain-deepseek>=1.0.1",
    "openai>=1.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "textual>=0.40.0",
    "ddgs>=9.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
poirot = "poirot.backend.app.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["poirot*"]
exclude = ["poirot.backend.tests*"]

[tool.setuptools.package-data]
"poirot.backend.agents" = ["prompts/**/*.md", "config/profiles/*.yaml", "skill/builtin_skills/**/SKILL.md", "multiagent/extensions/**/*.ts"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
]
docker = [
    "agent-sandbox>=0.0.19",
]
anthropic = [
    "langchain-anthropic>=0.3.0",
]
gemini = [
    "langchain-google-genai>=2.0.0",
]
ollama = [
    "langchain-ollama>=0.3.0",
]
providers = [
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]

[tool.pytest.ini_options]
testpaths = ["poirot/backend/tests"]
# 默认排除集成层（需真实 Docker / 真实 API key），保证"全量"是一条与宿主
# 环境无关的纯净基线。完整门禁为叠加运行：pytest && pytest -m integration。
addopts = "-m 'not integration'"
markers = [
    "integration: 需真实 Docker 守护进程或真实 LLM API key 的端到端测试",
]
